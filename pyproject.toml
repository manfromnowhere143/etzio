[project]
name = "etzio"
version = "0.0.1"
description = "Etzio — an evidence-native authorized vulnerability-research engine (architecture foundation)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography==49.0.0",
  "PyNaCl==1.6.2",
  "unicodedata2==17.0.1",
]
license = "LicenseRef-Proprietary"
license-files = ["LICENSE.md"]
authors = [
  { name = "Daniel Wahnich", email = "cogitoergosum143@gmail.com" },
]

[project.optional-dependencies]
native-time = [
  "aiohappyeyeballs==2.7.1",
  "aiohttp==3.14.4",
  "aiosignal==1.4.0",
  "asn1crypto==1.5.1",
  "attrs==26.1.0",
  "certifi==2026.7.22",
  "cffi==2.1.0",
  "cryptography==49.0.0",
  "frozenlist==1.8.0",
  "idna==3.20",
  "lxml==6.1.3",
  "multidict==6.9.1",
  "oscrypto==1.3.0",
  "propcache==0.5.4",
  "pycparser==3.0",
  "pyhanko==0.37.0",
  "pyhanko-certvalidator==0.32.1",
  "typing-extensions==4.16.0",
  "tzlocal==5.4.4",
  "uritools==6.1.3",
  "yarl==1.25.1",
]

dev = [
  "build==1.5.0",
  "jsonschema==4.26.0",
  "pytest==9.0.2",
  "ruff==0.15.20",
]

[project.scripts]
etzio = "etzio.scan:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP042"]

[tool.setuptools.packages.find]
include = ["etzio*"]

[tool.setuptools.package-data]
etzio = ["schemas/*.json"]

[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"
